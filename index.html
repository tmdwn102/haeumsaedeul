<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소실 — 프리뷰</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #ffffff;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 100;
  color: #1a1a1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
}

/* ── 헤더 ───────────────────────────────── */
#header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2vw;
  height: 6vh;
  flex-shrink: 0;
}
#title-text {
  font-size: clamp(12px, 1.1vw, 18px);
  letter-spacing: 0.3em;
  color: rgba(0,0,0,0.4);
}
#slide-counter {
  font-size: clamp(10px, 0.8vw, 13px);
  letter-spacing: 0.2em;
  color: rgba(0,0,0,0.25);
}

/* ── 두 패널 ────────────────────────────── */
#panels {
  display: flex;
  gap: 2vw;
  padding: 0 2vw;
  width: 100%;
  flex: 1;
  align-items: center;
  justify-content: center;
}

.proj-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 1vh;
  min-width: 0;
}

.proj-label {
  font-size: clamp(8px, 0.65vw, 11px);
  letter-spacing: 0.25em;
  color: rgba(0,0,0,0.3);
  text-align: center;
}

.stage {
  position: relative;
  background: #050505;
  overflow: hidden;
  width: 100%;
}

.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.ph {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ph-num {
  font-size: 8vw;
  font-weight: 100;
  color: rgba(255,255,255,0.04);
  user-select: none;
}
.ph-black {
  width: 100%;
  height: 100%;
  background: #030303;
}
.ph-floor {
  width: 100%;
  height: 100%;
  background: #080808;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.06);
  font-size: clamp(8px, 0.7vw, 11px);
  letter-spacing: 0.2em;
}

/* ── 하단 컨트롤 ────────────────────────── */
#controls {
  width: 100%;
  padding: 0 2vw;
  height: 7vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1.2vh;
  flex-shrink: 0;
}

#progress-bar-bg {
  width: 100%;
  height: 1px;
  background: rgba(0,0,0,0.1);
  position: relative;
}
#progress-bar-fill {
  height: 100%;
  background: rgba(0,0,0,0.4);
  width: 0%;
}

#bottom-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#play-btn {
  font-size: clamp(9px, 0.7vw, 12px);
  letter-spacing: 0.2em;
  color: rgba(0,0,0,0.4);
  cursor: pointer;
  user-select: none;
  transition: color 0.2s;
}
#play-btn:hover { color: rgba(0,0,0,0.8); }

#sound-btn {
  font-size: clamp(9px, 0.7vw, 12px);
  letter-spacing: 0.2em;
  color: rgba(0,0,0,0.25);
  cursor: pointer;
  user-select: none;
  transition: color 0.2s;
}
#sound-btn:hover { color: rgba(0,0,0,0.6); }

#hint-text {
  font-size: clamp(7px, 0.55vw, 10px);
  color: rgba(0,0,0,0.15);
  letter-spacing: 0.12em;
}

/* ── 시작 화면 ──────────────────────────── */
#start {
  position: fixed;
  inset: 0;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  transition: opacity 0.5s ease;
}
#start.out { opacity: 0; pointer-events: none; }

#start-btn {
  font-size: clamp(10px, 0.9vw, 14px);
  font-weight: 100;
  color: rgba(0,0,0,0.35);
  letter-spacing: 0.3em;
  cursor: pointer;
  border: 1px solid rgba(0,0,0,0.15);
  padding: 0.8em 2em;
  transition: color 0.2s, border-color 0.2s;
  user-select: none;
}
#start-btn:hover {
  color: rgba(0,0,0,0.7);
  border-color: rgba(0,0,0,0.4);
}
</style>
</head>
<body>

<div id="start">
  <div id="start-btn">시작</div>
</div>

<div id="header">
  <div id="title-text">소 실 &nbsp;·&nbsp; 消 失</div>
  <div id="slide-counter">—</div>
</div>

<div id="panels">
  <!-- 벽 프로젝터 -->
  <div class="proj-wrap">
    <div class="proj-label">프로젝터 1 &nbsp;—&nbsp; 벽</div>
    <div class="stage" id="wall-stage"></div>
  </div>

  <!-- 바닥 프로젝터 -->
  <div class="proj-wrap">
    <div class="proj-label">프로젝터 2 &nbsp;—&nbsp; 바닥</div>
    <div class="stage" id="floor-stage"></div>
  </div>
</div>

<div id="controls">
  <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
  <div id="bottom-row">
    <div id="play-btn">▶ &nbsp;시작</div>
    <div id="hint-text">SPACE 일시정지 &nbsp;·&nbsp; ← → 이동 &nbsp;·&nbsp; R 처음</div>
    <div id="sound-btn">♪ &nbsp;사운드 켜기</div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  슬라이드 데이터
//  이미지 교체: image: './images/01.png'
//  HTML 파일과 같은 폴더에 이미지 파일 넣기
// ══════════════════════════════════════════════════════

const WALL = [  // 벽 프로젝터 — 16장 드로잉
  {image:'1.png',   dur:13000, fi:2500, fo:2500}, // 01
  {image:'2.png',   dur:13000, fi:2500, fo:2500}, // 02
  {image:'3.png',   dur:13000, fi:2500, fo:2500}, // 03
  {image:'4.png',   dur:13000, fi:2500, fo:2500}, // 04
  {image:'5.png',   dur: 7000, fi:1500, fo:1500}, // 05
  {image:'6.png',   dur: 7000, fi:1500, fo:1500}, // 06
  {image:'7.png',   dur: 7000, fi:1500, fo:1500}, // 07
  {image:'8.png',   dur: 7000, fi:1500, fo:1500}, // 08
  {image:'9.png',   dur: 7000, fi:1500, fo:1500}, // 09
  {image:'10.png',  dur: 7000, fi:1500, fo:1500}, // 10
  {image:'11.png',  dur: 2500, fi: 600, fo: 600}, // 11 컷
  {image:'12.png',  dur: 2500, fi: 600, fo: 600}, // 12 컷
  {image:'13.png',  dur: 2500, fi: 600, fo: 600}, // 13 컷
  {image:'14.png',  dur: 2500, fi: 600, fo: 600}, // 14 컷
  {image:'15.png',  dur: 2500, fi: 800, fo: 800}, // 15
  {image:'16.png',  dur:13000, fi:2000, fo:   0}, // 16 마지막
];

const FLOOR = [ // 바닥 프로젝터 — 1-15 검정, 16 평면도
  {image:'', type:'black', fi:0, fo:0},
  {image:'', type:'black', fi:0, fo:0},
  {image:'', type:'black', fi:0, fo:0},
  {image:'', type:'black', fi:0, fo:0},
  {image:'', type:'black', fi:0, fo:0},
  {image:'', type:'black', fi:0, fo:0},
  {image:'', type:'black', fi:0, fo:0},
  {image:'', type:'black', fi:0, fo:0},
  {image:'', type:'black', fi:0, fo:0},
  {image:'', type:'black', fi:0, fo:0},
  {image:'', type:'black', fi:0, fo:0},
  {image:'', type:'black', fi:0, fo:0},
  {image:'', type:'black', fi:0, fo:0},
  {image:'', type:'black', fi:0, fo:0},
  {image:'', type:'black', fi:0, fo:0},
  {image:'16.png', type:'plan', fi:2000, fo:0}, // 16: 바닥 평면도
];

// ── 스테이지 크기 ──────────────────────────
const wallStage  = document.getElementById('wall-stage');
const floorStage = document.getElementById('floor-stage');

function resizeStages() {
  [wallStage, floorStage].forEach(s => {
    const w = s.offsetWidth;
    s.style.height = (w * 9 / 16) + 'px';
  });
}
resizeStages();
window.addEventListener('resize', resizeStages);

// ── 슬라이드 DOM 생성 ─────────────────────
function buildSlides(data, stage, isFloor) {
  return data.map((s, i) => {
    const el = document.createElement('div');
    el.className = 'slide';
    el.style.zIndex = i + 1;

    if (s.image) {
      el.style.backgroundImage = `url('${s.image}')`;
    } else if (isFloor && s.type === 'plan') {
      const ph = document.createElement('div');
      ph.className = 'ph-floor';
      ph.textContent = '16 — 평면도 이미지';
      el.appendChild(ph);
    } else if (isFloor) {
      const ph = document.createElement('div');
      ph.className = 'ph-black';
      el.appendChild(ph);
    } else {
      const ph  = document.createElement('div'); ph.className = 'ph';
      const num = document.createElement('div'); num.className = 'ph-num';
      num.textContent = String(i+1).padStart(2,'0');
      ph.appendChild(num); el.appendChild(ph);
    }
    stage.appendChild(el);
    return el;
  });
}

const wallEls  = buildSlides(WALL,  wallStage,  false);
const floorEls = buildSlides(FLOOR, floorStage, true);

// ── 상태 ──────────────────────────────────
let current = -1, playing = false, paused = false;
let slideTimer = null;
let barRaf = null, barStart = 0, barDur = 0;
let pauseRemain = 0, pauseAt = 0;

const counter  = document.getElementById('slide-counter');
const barFill  = document.getElementById('progress-bar-fill');
const playBtn  = document.getElementById('play-btn');
const pausedEl = null; // 패널에 별도 오버레이 없음

// ── 슬라이드 전환 (크로스페이드: 사라지면서 동시에 나타남) ─────────────────
function showSlide(els, data, idx) {
  const s  = data[idx];
  const el = els[idx];

  // 새 이미지 위로 올리고 fade in 시작
  el.style.zIndex = data.length + 10;
  el.style.transition = 'none';
  el.style.opacity = '0';
  void el.offsetWidth;
  el.style.transition = s.fi > 0 ? `opacity ${s.fi}ms ease` : 'none';
  void el.offsetWidth;
  el.style.opacity = '1';

  // 이전 이미지는 동시에 fade out
  const prev = idx - 1;
  if (prev >= 0) {
    const prevEl = els[prev];
    const fo = data[prev].fo || 0;
    prevEl.style.transition = fo > 0 ? `opacity ${fo}ms ease` : 'none';
    prevEl.style.opacity = '0';
    setTimeout(() => { prevEl.style.zIndex = prev + 1; }, Math.max(fo, s.fi) + 50);
  }
}

function goTo(idx) {
  if (idx < 0 || idx >= WALL.length) return;
  current = idx;

  showSlide(wallEls,  WALL,  idx);
  showSlide(floorEls, FLOOR, idx);

  counter.textContent = `${String(idx+1).padStart(2,'0')} / ${WALL.length}`;

  updateSound(idx);

  clearTimeout(slideTimer);
  barFill.style.width = '0%';

  if (idx < WALL.length - 1) {
    startBar(WALL[idx].dur);
    pauseAt = performance.now();
    slideTimer = setTimeout(() => goTo(idx + 1), WALL[idx].dur);
  } else {
    // 마지막 슬라이드
    startBar(WALL[idx].dur);
  }
}

// ── 타이머 바 ─────────────────────────────
function startBar(dur) {
  cancelAnimationFrame(barRaf);
  barStart = performance.now(); barDur = dur;
  function tick() {
    if (paused) return;
    const pct = Math.min((performance.now()-barStart)/barDur*100, 100);
    barFill.style.width = pct + '%';
    if (pct < 100) barRaf = requestAnimationFrame(tick);
  }
  barRaf = requestAnimationFrame(tick);
}

// ── 일시정지 ──────────────────────────────
function togglePause() {
  if (!playing) return;
  if (!paused) {
    paused = true;
    playBtn.textContent = '▶ \u00a0재개';
    clearTimeout(slideTimer);
    cancelAnimationFrame(barRaf);
    pauseRemain = WALL[current].dur - (performance.now() - pauseAt);
    soundPause();
  } else {
    paused = false;
    playBtn.textContent = '⏸ \u00a0일시정지';
    slideTimer = setTimeout(() => goTo(current + 1), pauseRemain);
    barStart = performance.now() - (WALL[current].dur - pauseRemain);
    startBar(WALL[current].dur);
    pauseAt = performance.now() - (WALL[current].dur - pauseRemain);
    soundResume();
  }
}

// ── 시작/재시작 ───────────────────────────
function start() {
  playing = true;
  paused  = false;
  playBtn.textContent = '⏸ \u00a0일시정지';
  initSound();
  goTo(0);
}

playBtn.addEventListener('click', () => {
  if (!playing) { start(); }
  else          { togglePause(); }
});

// ── 키보드 ────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); if (playing) togglePause(); else start(); return; }
  if (!playing || paused) return;
  if (e.key === 'ArrowRight') {
    clearTimeout(slideTimer); cancelAnimationFrame(barRaf);
    goTo(Math.min(current+1, WALL.length-1));
  }
  if (e.key === 'ArrowLeft') {
    clearTimeout(slideTimer); cancelAnimationFrame(barRaf);
    goTo(Math.max(current-1, 0));
  }
  if (e.key==='r'||e.key==='R') {
    clearTimeout(slideTimer); cancelAnimationFrame(barRaf);
    paused = false; start();
  }
});

document.getElementById('start').addEventListener('click', function() {
  this.classList.add('out');
  setTimeout(() => this.style.display='none', 600);
  start();
});

// ══════════════════════════════════════════
//  사운드 — Web Audio API
// ══════════════════════════════════════════
let audioCtx = null;
let droneGain = null, noiseGain = null;
let drone1, drone2, noiseNode;
let soundOn = false;

const soundBtn = document.getElementById('sound-btn');
soundBtn.addEventListener('click', () => {
  if (!audioCtx) return;
  soundOn = !soundOn;
  if (soundOn) {
    audioCtx.resume();
    soundBtn.textContent = '♪ \u00a0사운드 끄기';
  } else {
    audioCtx.suspend();
    soundBtn.textContent = '♪ \u00a0사운드 켜기';
  }
});

function initSound() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  soundOn = true;
  soundBtn.textContent = '♪ \u00a0사운드 끄기';

  // ── 마스터 ──
  const master = audioCtx.createGain();
  master.gain.value = 0.7;
  master.connect(audioCtx.destination);

  // ── 베이스 드론 ──
  droneGain = audioCtx.createGain();
  droneGain.gain.value = 0.0;
  droneGain.connect(master);

  drone1 = audioCtx.createOscillator();
  drone1.type = 'sine';
  drone1.frequency.value = 55; // A1
  drone1.connect(droneGain);
  drone1.start();

  drone2 = audioCtx.createOscillator();
  drone2.type = 'sine';
  drone2.frequency.value = 82.4; // E2
  const drone2Gain = audioCtx.createGain();
  drone2Gain.gain.value = 0.5;
  drone2.connect(drone2Gain);
  drone2Gain.connect(droneGain);
  drone2.start();

  // ── 도시 노이즈 (갈색 노이즈) ──
  noiseGain = audioCtx.createGain();
  noiseGain.gain.value = 0.0;
  noiseGain.connect(master);

  // 버퍼 노이즈 생성
  const sr = audioCtx.sampleRate;
  const buf = audioCtx.createBuffer(1, sr * 4, sr);
  const d = buf.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0;
  for (let i=0; i<d.length; i++) {
    const w = Math.random()*2-1;
    b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
    b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
    b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
    d[i]=(b0+b1+b2+b3+b4+b5+w*0.5362)*0.11;
  }

  noiseNode = audioCtx.createBufferSource();
  noiseNode.buffer = buf;
  noiseNode.loop = true;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 300;
  filter.Q.value = 0.5;

  noiseNode.connect(filter);
  filter.connect(noiseGain);
  noiseNode.start();

  // 첫 슬라이드용 사운드 초기화
  updateSound(0);
}

function updateSound(idx) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + 0.1;

  if (idx <= 3) {
    // 1-4장: 드론 + 도시 노이즈 풀
    droneGain.gain.linearRampToValueAtTime(0.12, t + 1.5);
    noiseGain.gain.linearRampToValueAtTime(0.18, t + 1.5);
  } else if (idx <= 9) {
    // 5-10장: 노이즈 점점 얇아짐
    const pct = (idx - 3) / 6;
    const nv = 0.18 * (1 - pct * 0.9);
    droneGain.gain.linearRampToValueAtTime(0.12, t + 1.0);
    noiseGain.gain.linearRampToValueAtTime(nv, t + 2.0);
  } else if (idx <= 14) {
    // 11-15장: 노이즈 거의 사라짐, 드론만
    droneGain.gain.linearRampToValueAtTime(0.08, t + 0.5);
    noiseGain.gain.linearRampToValueAtTime(0.01, t + 0.5);
  } else {
    // 16장: 드론 매우 낮게, 정적
    droneGain.gain.linearRampToValueAtTime(0.03, t + 4.0);
    noiseGain.gain.linearRampToValueAtTime(0.0, t + 2.0);
  }
}

function soundPause() { if (audioCtx) audioCtx.suspend(); }
function soundResume() { if (audioCtx && soundOn) audioCtx.resume(); }

// ── 반응형 재사이징 ───────────────────────
window.addEventListener('resize', () => {
  resizeStages();
});
</script>
</body>
</html>
